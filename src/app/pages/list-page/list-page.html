<div class="p-6">
  <h1 class="text-2xl font-semibold mb-6">Danh sách</h1>

  <div class="overflow-x-auto">
    <table class="w-full border border-gray-300 rounded-lg">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2 border border-gray-300 text-center">ID</th>
          <th class="px-4 py-2 border border-gray-300 text-center">Title</th>
          <th class="px-4 py-2 border border-gray-300 text-center">quantity</th>
          <th class="px-4 py-2 border border-gray-300 text-center">cover</th>
           <th class="px-4 py-2 border border-gray-300 text-center">genre</th>
          <th class="px-4 py-2 border border-gray-300 text-center">Actions</th>
        </tr>
      </thead>
      @for(book  of books; track book.id){
          <tbody>
   <tr class="hover:bg-gray-50">
          <td class="px-4 py-2 border border-gray-300">{{book.id}}</td>
          <td class="px-4 py-2 border border-gray-300">{{book.title}}</td>
          <td class="px-4 py-2 border border-gray-300">{{book.quantity}}</td>
             <td class="px-4 py-2 border border-gray-300">{{book.cover}}</td>
            <td class="px-4 py-2 border border-gray-300">{{book.genre}}</td>
               
          <td class="px-4 py-2 border border-gray-300">
            <div class="flex gap-2 justify-center">
              <button
                class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
                 (click)="deleteBooks(book.id)"
                 
              >
                Delete
              </button>
              <button
              [routerLink]="['/edit',book.id]"
                class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
              >
                Edit
              </button>
            </div>
          </td>
        </tr>
      </tbody>
}
    </table>
  </div>
</div>

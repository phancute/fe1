<div class="p-6">
  <h1 class="text-2xl font-semibold mb-6">Thêm mới</h1>

  <form class="space-y-6" [formGroup]="addForm" (ngSubmit)="submitForm()">
    <div>
      <label htmlFor="text" class="block font-medium mb-1" > title </label>
      <input
        type="text"
        id="text"
        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      formControlName="title"
      />
    </div>

    <div>
      <label htmlFor="text" class="block font-medium mb-1" > quantity </label>
      <input
        type="text"
        id="text"
        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      formControlName="quantity"
      />
    </div>
      <div>
      <label htmlFor="text" class="block font-medium mb-1" > cover </label>
      <input
        type="text"
        id="text"
        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      formControlName="cover"
      />
    </div>


    <div>
      <label htmlFor="text" class="block font-medium mb-1"> Select </label>
      <select
        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        formControlName="genre"
      >
        <option value="Option 1">sách 1</option>
        <option value="Option 2">sách 2</option>
      </select>
    </div>

    <button
      type="submit"
      class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
    
    >
      Submit
    </button>
  </form>
</div>
